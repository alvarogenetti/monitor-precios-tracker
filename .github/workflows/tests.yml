name: tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: "Instalar dependencias (sin navegador: los tests no usan red)"
        run: pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q
