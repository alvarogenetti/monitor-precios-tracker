name: price-watch

on:
  schedule:
    - cron: "7,37 * * * *"  # cada 30 min (GitHub pierde corridas); services/events decide si escanea
  workflow_dispatch: {}      # botón "Run workflow" para correrlo a mano

permissions:
  contents: write            # publicar la base en la rama "data"
  pages: write               # publicar el dashboard en GitHub Pages
  id-token: write

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - name: ¿Toca escanear? (pasaron 2h45 desde el último, o 45 min durante eventos)
        id: gate
        run: |
          # Base de la rama data (sin dependencias) para ver cuándo fue el último escaneo de GitHub
          git fetch --quiet --depth=1 origin data && git cat-file blob FETCH_HEAD:prices.db > /tmp/prices.db || true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || python3 -m services.events should-run /tmp/prices.db; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache de Chromium (Playwright)
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Bajar la base de la rama data
        if: steps.gate.outputs.run == 'true'
        run: python -m services.datastore pull

      - name: Escanear precios
        if: steps.gate.outputs.run == 'true'
        run: python scan.py --once

      # Una vez por día (primera corrida desde las 12 UTC = 9 AR) o a mano: modelos nuevos + resumen
      - name: Descubrir modelos nuevos y resumen diario
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || python -m services.daily due; then
            python scan.py --discover
            python scan.py --summary
          else
            echo "Ya se hizo hoy (o todavía no son las 12 UTC)"
          fi

      - name: Publicar la base en la rama data
        if: always() && steps.gate.outputs.run == 'true'
        run: python -m services.datastore push

      - name: Generar dashboard público
        if: always() && steps.gate.outputs.run == 'true'
        run: python -m app.site site

      - uses: actions/configure-pages@v6
        if: always() && steps.gate.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: always() && steps.gate.outputs.run == 'true'
        with:
          path: site

      - name: Publicar en GitHub Pages
        id: deploy
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v5
