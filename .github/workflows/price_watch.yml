name: price-watch

on:
  schedule:
    - cron: "0 */3 * * *"   # cada 3 horas (UTC)
  workflow_dispatch: {}      # botón "Run workflow" para correrlo a mano

permissions:
  contents: write            # necesario para commitear data/prices.db

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache de Chromium (Playwright)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Escanear precios
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan.py --once

      # Una vez por día (corrida de las 12 UTC = 9 AR) o a mano: busca modelos nuevos que cumplan
      - name: Descubrir modelos nuevos
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%H)" = "12" ]; then
            python scan.py --discover
          else
            echo "Descubrimiento: sólo en la corrida de las 12 UTC"
          fi

      - name: Commitear base actualizada
        if: always()
        run: |
          git config user.name "price-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.db
          if git diff --cached --quiet; then
            echo "Sin cambios en la base"
          else
            git commit -m "chore(data): snapshot de precios $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi
